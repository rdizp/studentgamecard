<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Student Game Card</title>

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      color: #1E3A5F;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .message {
      padding: 24px;
    }

    .loader {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border: 3px solid #D9D9D9;
      border-top-color: #F4B400;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="message">

    <div class="loader"></div>

    <h1>Opening your game card...</h1>

    <p>Please wait.</p>

  </div>


  <script>

    const APP_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbwqDppJc8kVL4tkjlibwLTbU4wtb030Q3AyEgr6g82rMT9ld1AWILgdsYdQneeOy8Wlxg/exec';


    const params =
      new URLSearchParams(
        window.location.search
      );


    const cardCode =
      params.get('card');


    if (!cardCode) {

      document
        .querySelector('.message')
        .innerHTML =

        '<h1>Invalid Card QR</h1>' +
        '<p>No card code was provided.</p>';

    } else {

      const destination =
        APP_SCRIPT_URL +
        '?card=' +
        encodeURIComponent(
          cardCode
        );


      window.location.replace(
        destination
      );

    }

  </script>

</body>
</html>
