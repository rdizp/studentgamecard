<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student Game Card</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #1E3A5F;
      --mustard: #F4B400;
      --off-white: #F8F9FA;
      --gray: #D9D9D9;
      --text: #18212F;
      --muted: #697586;
      --success-bg: #EAF7EE;
      --success-text: #176B35;
      --error-bg: #FDECEC;
      --error-text: #A32121;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 16px max(20px, env(safe-area-inset-bottom));
      background: var(--off-white);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .app-card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--gray);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(30, 58, 95, 0.10);
    }

    .app-header {
      padding: 24px 22px 22px;
      background: var(--navy);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .app-header::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(244, 180, 0, 0.15);
      right: -45px;
      top: -55px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .brand-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--mustard);
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .app-header h1 {
      margin: 18px 0 5px;
      font-family: Poppins, Arial, sans-serif;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .app-header p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.78);
      position: relative;
      z-index: 1;
    }

    .content { padding: 22px; }

    /* Info Section Styles */
    .card-code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 15px;
      background: #F4F7FA;
      border: 1px solid #E2E7ED;
      border-radius: 14px;
      margin-bottom: 22px;
    }

    .card-code-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .card-code-value {
      font-family: Poppins, Arial, sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
      text-align: right;
    }

    .info-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .info-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.055em;
    }

    .value {
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
      color: var(--text);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      padding: 13px 15px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .status.active { background: var(--success-bg); color: var(--success-text); }
    .status.inactive { background: var(--error-bg); color: var(--error-text); }

    /* Operator & Score Sections */
    #operatorSection, #scoreSection, #scannerSection {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #ECEFF2;
    }

    .section-heading h2 {
      margin: 0;
      font-family: Poppins, Arial, sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: var(--navy);
    }

    .section-heading p {
      margin: 5px 0 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .pin-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #DCE2E8;
      border-radius: 13px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-align: center;
      outline: none;
    }

    .btn-primary {
      width: 100%;
      margin-top: 11px;
      padding: 14px;
      border: none;
      border-radius: 13px;
      background: var(--navy);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .score-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .score-buttons button {
      min-height: 58px;
      border: 1px solid #DCE2E8;
      border-radius: 15px;
      background: white;
      color: var(--navy);
      font-family: Poppins, sans-serif;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .score-buttons button:active { background: var(--mustard); transform: scale(0.96); }

    #recordMessage, #authMessage {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .success { color: var(--success-text); }
    .error { color: var(--error-text); }

    #reader { width: 100%; border-radius: 16px; overflow: hidden; background: #111; }
    
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div class="app-card">
    <header class="app-header">
      <div class="brand-row">
        <span class="brand-dot"></span>
        <span class="brand-name">Student Game Card</span>
      </div>
      <h1>Player Card</h1>
      <p>Scan, verify, and record game points.</p>
    </header>

    <main class="content">
      <!-- Card Info (Selalu Muncul Jika Ada ID) -->
      <div id="cardDisplay">
        <div class="card-code-box">
          <div class="card-code-label">Card Code</div>
          <div class="card-code-value" id="cardCodeValue">-</div>
        </div>

        <div class="info-section">
          <div class="info-item">
            <div class="label">Full Name</div>
            <div class="value" id="fullNameValue">-</div>
          </div>
          <div class="info-item">
            <div class="label">NIM</div>
            <div class="value" id="nimValue">-</div>
          </div>
          <div class="info-item">
            <div class="label">Enrolled Practical Course</div>
            <div class="value" id="courseValue">-</div>
          </div>
        </div>

        <div id="statusBadge" class="status">Loading information...</div>
      </div>

      <!-- Operator Section (PIN) -->
      <div id="operatorSection" class="hidden">
        <div class="section-heading">
          <h2>Operator Access</h2>
          <p>Enter PIN to unlock point recording.</p>
        </div>
        <input id="operatorPin" class="pin-input" type="password" inputmode="numeric" placeholder="Enter PIN">
        <button id="unlockButton" class="btn-primary" onclick="authenticateAndUnlock()">Unlock Scoring</button>
        <div id="authMessage"></div>
      </div>

      <!-- Score Section (Hidden until PIN correct) -->
      <div id="scoreSection" class="hidden">
        <div class="section-heading">
          <h2>Record Points</h2>
          <p>Tap points earned by the player.</p>
        </div>
        <div class="score-buttons">
          <button onclick="recordScore(1)">+1</button>
          <button onclick="recordScore(2)">+2</button>
          <button onclick="recordScore(3)">+3</button>
          <button onclick="recordScore(5)">+5</button>
        </div>
        <div id="recordMessage"></div>
        <button class="btn-primary" style="background: var(--mustard); color: var(--navy);" onclick="scanAnotherPlayer()">
          📷 Scan Another Player
        </button>
      </div>

      <!-- Scanner Section -->
      <div id="scannerSection" class="hidden">
        <div class="section-heading">
          <h2 style="text-align: center;">Scan QR Code</h2>
        </div>
        <div id="reader"></div>
        <button class="btn-primary" style="background: white; color: var(--navy); border: 1px solid var(--gray);" onclick="closeScanner()">
          Close Scanner
        </button>
      </div>
    </main>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwqDppJc8kVL4tkjlibwLTbU4wtb030Q3AyEgr6g82rMT9ld1AWILgdsYdQneeOy8Wlxg/exec';
    
    let sessionToken = '';
    let cardData = null;
    let html5QrCode = null;

    // Helper API
    async function apiRequest(action, method = 'GET', data = {}) {
      const url = new URL(API_URL);
      if (method === 'GET') {
        url.searchParams.set('action', action);
        Object.entries(data).forEach(([k, v]) => url.searchParams.set(k, v));
      }

      const options = {
        method: method,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      };
      if (method === 'POST') options.body = JSON.stringify({ action, ...data });

      const response = await fetch(url.toString(), options);
      return await response.json();
    }

    // Load Card Info (Step 1)
    async function loadPlayerCard(cardCode) {
      const statusBadge = document.getElementById('statusBadge');
      statusBadge.textContent = "Loading...";
      statusBadge.className = "status";

      try {
        const result = await apiRequest('card', 'GET', { card: cardCode });
        if (result.success) {
          cardData = result.data;
          document.getElementById('cardCodeValue').textContent = cardData.cardCode;
          document.getElementById('fullNameValue').textContent = cardData.fullName;
          document.getElementById('nimValue').textContent = cardData.nim;
          document.getElementById('courseValue').textContent = cardData.course;

          const isActive = String(cardData.status).toLowerCase() === 'active';
          statusBadge.textContent = isActive ? "🟢 ACTIVE" : "🔴 INACTIVE";
          statusBadge.className = "status " + (isActive ? "active" : "inactive");

          if (isActive && !sessionToken) {
            document.getElementById('operatorSection').classList.remove('hidden');
          }
        } else {
          statusBadge.textContent = "🔴 Card Not Found";
          statusBadge.className = "status inactive";
        }
      } catch (e) {
        statusBadge.textContent = "🔴 Error Loading Data";
      }
    }

    // Authenticate (Step 2)
    async function authenticateAndUnlock() {
      const pin = document.getElementById('operatorPin').value;
      const msg = document.getElementById('authMessage');
      const btn = document.getElementById('unlockButton');

      if (!pin) return;
      btn.disabled = true;
      msg.textContent = "Authenticating...";

      try {
        const result = await apiRequest('create-session', 'POST', { operatorPin: pin });
        if (result.success) {
          sessionToken = result.sessionToken;
          document.getElementById('operatorSection').classList.add('hidden');
          document.getElementById('scoreSection').classList.remove('hidden');
        } else {
          msg.textContent = result.message || "Invalid PIN";
          msg.className = "error";
        }
      } catch (e) {
        msg.textContent = "Server Error";
      } finally {
        btn.disabled = false;
      }
    }

    // Record Score (Step 3)
    async function recordScore(points) {
      const msg = document.getElementById('recordMessage');
      msg.textContent = "Recording...";
      msg.className = "";

      try {
        const result = await apiRequest('record-score', 'POST', {
          sessionToken,
          cardCode: cardData.cardCode,
          points: points
        });

        if (result.success) {
          msg.textContent = `✓ ${points} points recorded!`;
          msg.className = "success";
        } else {
          msg.textContent = result.message;
          msg.className = "error";
          if (result.status === 'EXPIRED') {
            sessionToken = '';
            document.getElementById('scoreSection').classList.add('hidden');
            document.getElementById('operatorSection').classList.remove('hidden');
          }
        }
      } catch (e) {
        msg.textContent = "Failed to record";
      }
    }

    // Scanner Logic
    function extractCardCode(text) {
      try {
        const url = new URL(text);
        return url.searchParams.get('card');
      } catch (e) {
        return text.match(/^PLAYER-\d+$/i) ? text : null;
      }
    }

    async function scanAnotherPlayer() {
      document.getElementById('scoreSection').classList.add('hidden');
      document.getElementById('scannerSection').classList.remove('hidden');
      
      html5QrCode = new Html5Qrcode("reader");
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async (decodedText) => {
          const code = extractCardCode(decodedText);
          if (code) {
            await closeScanner();
            loadPlayerCard(code);
            document.getElementById('scoreSection').classList.remove('hidden');
            document.getElementById('recordMessage').textContent = "";
          }
        }
      );
    }

    async function closeScanner() {
      if (html5QrCode) {
        await html5QrCode.stop();
        html5QrCode.clear();
      }
      document.getElementById('scannerSection').classList.add('hidden');
      if (sessionToken) document.getElementById('scoreSection').classList.remove('hidden');
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const card = params.get('card');
      if (card) loadPlayerCard(card);
      else document.getElementById('statusBadge').textContent = "🔐 Please Scan a Card";
    });

    document.getElementById('operatorPin').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') authenticateAndUnlock();
    });
  </script>
</body>
</html>
